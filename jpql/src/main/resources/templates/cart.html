<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>장바구니</title>
      <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
      >
</head>
<body>
         <!-- fragments.html 영역파일을 불러와서 추가 -->
        <div th:replace="~{fragments :: navbar}"></div>
      <main class="container py-5">
          <h1>장바구니</h1>
          <p
              class="text-secondary"
              th:text="${user != null ? user.username + '님의 장바구니' : '회원 없음'}"
          ></p>
          <!-- 장바구니가 있는 경우 -->
          <div th:if="${cart != null}">
              <table class="table">
                  <thead>
                      <tr>
                          <th>상품</th>
                          <th>수량</th>
                          <th>단가</th>
                          <th>금액</th>
                    </tr>
                </thead>
                  <tbody>
                      <tr th:each="ci : ${cart.cartItems}">
                          <td th:text="${ci.product.name}"></td>
                          <td th:text="${ci.quantity}"></td>
                          <td th:text="${ci.product.price} + '원'"></td>
                          <td th:text="${ci.product.price * ci.quantity} + '원'"></td>
                    </tr>
                </tbody>
            </table>
        </div>
          <!-- 장바구니가 없는 경우 -->
          <div
              th:if="${cart == null}"
              class="alert alert-light border"
          >
              장바구니가 없습니다.
          </div>
    </main>
</body>
</html>
