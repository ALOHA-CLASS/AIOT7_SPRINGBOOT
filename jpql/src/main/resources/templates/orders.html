<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>주문내역</title>
      <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
      >
</head>
<body>
        <!-- fragments.html 영역파일을 불러와서 추가 -->
        <div th:replace="~{fragments :: navbar}"></div>
      <main class="container py-5">
          <h1>주문내역</h1>
          <p
              class="text-secondary"
              th:text="${user != null ? user.username + '님의 주문내역' : '회원 없음'}"
          ></p>
          <table class="table table-hover">
              <thead>
                  <tr>
                      <th>주문번호</th>
                      <th>주문일</th>
                      <th>상태</th>
                      <th>상품 수</th>
                </tr>
            </thead>
              <tbody>
                  <tr th:each="o : ${orders}">
                      <td th:text="${o.no}"></td>
                      <td
                          th:text="${#temporals.format(o.orderDate, 'yyyy-MM-dd HH:mm')}"
                      ></td>
                      <td>
                          <span
                              class="badge text-bg-secondary"
                              th:text="${o.status}"
                          ></span>
                    </td>
                      <td th:text="${#lists.size(o.orderItems)}"></td>
                </tr>
                  <!-- 주문내역이 없는 경우 -->
                  <tr th:if="${#lists.isEmpty(orders)}">
                      <td
                          colspan="4"
                          class="text-center text-secondary py-4"
                      >
                          주문내역이 없습니다.
                      </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
