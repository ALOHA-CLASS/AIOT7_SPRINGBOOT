<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 조회</title>
</head>
<body>
  <h1>게시글 조회</h1>
  <div>
    <form action="/posts" method="post">
      <div>
        <label for="title">제목</label>
        <input type="text" id="title" name="title" th:value="${post.title}">
      </div>
      <div>
        <label for="writer">작성자</label>
        <input type="text" id="writer" name="writer" th:value="${post.writer}">
      </div>
      <div>
        <label for="content">내용</label>
        <textarea name="content" id="content" rows="5" cols="40" th:text="${post.content}"></textarea>
      </div>
      <div>
        <a th:href="|/posts/${post.id}/update|">수정</a>

      </div>
    </form>
  </div>
</body>
</html>
