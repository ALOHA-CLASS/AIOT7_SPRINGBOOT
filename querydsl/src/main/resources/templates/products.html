<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>상품 목록 - Criteria API</title>
      <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
      >
</head>
<body>
    <!-- fragments.html 영역파일을 불러와서 추가 -->
    <div th:replace="~{fragments :: navbar}"></div>
    <main class="container py-5">
        <h1 class="mb-4">상품 목록</h1>

        <!-- Criteria API 동적 검색 폼 -->
        <form class="row g-2 mb-4" method="get">
            <div class="col-md-3">
                <input
                    class="form-control"
                    name="name"
                    th:value="${name}"
                    placeholder="상품명"
                >
            </div>
            <div class="col-md-2">
                <input
                    class="form-control"
                    type="number"
                    name="minPrice"
                    th:value="${minPrice}"
                    placeholder="최소 가격"
                >
            </div>
            <div class="col-md-2">
                <input
                    class="form-control"
                    type="number"
                    name="maxPrice"
                    th:value="${maxPrice}"
                    placeholder="최대 가격"
                >
            </div>
            <div class="col-md-2">
                <input
                    class="form-control"
                    type="number"
                    name="minStock"
                    th:value="${minStock}"
                    placeholder="최소 재고"
                >
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-dark w-50" type="submit">검색</button>
                <a class="btn btn-outline-secondary w-50" href="/products">초기화</a>
            </div>
        </form>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>상품명</th>
                    <th>가격</th>
                    <th>재고</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.no}"></td>
                    <td th:text="${p.name}"></td>
                    <td
                        th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'"
                    ></td>
                    <td th:text="${p.stock}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="4" class="text-center text-secondary">검색 결과가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
