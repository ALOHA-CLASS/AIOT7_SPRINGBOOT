<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criteria API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- fragments.html 영역파일을 불러와서 추가 -->
    <div th:replace="~{fragments :: navbar}"></div>

    <main class="container py-5">
        <h1 class="mb-2">JPA Criteria API 실습</h1>
        <p class="text-secondary mb-4">
            Product 엔터티 + CriteriaBuilder 로 배우는 동적 쿼리
        </p>
        <!-- 통계 카드 -->
        <div class="row g-3 mb-4">
            <!-- 상품 -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <div class="text-secondary">상품</div>
                        <h2 th:text="${productCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <a class="btn btn-dark" href="/products">상품 목록 / Criteria 검색</a>
    </main>
</body>
</html>
